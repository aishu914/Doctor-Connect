# ==============================================================================
# OPENSHIFT MANIFEST 1: MYSQL DATABASE
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  labels:
    app: doctor-connect
type: Opaque
stringData:
  database-name: "doctor_connect"
  database-user: "doctor_user"
  database-password: "DoctorSecurePass2026!"
  database-root-password: "RootAdminPass2026!"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    app: doctor-connect
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: doctor-connect
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-connect
      component: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: doctor-connect
        component: database
    spec:
      containers:
        - name: mysql
          image: registry.redhat.io/rhel9/mysql-80:latest
          # Alternative public image if registry.redhat.io credentials are not configured:
          # image: docker.io/mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: database-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: database-root-password
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql/data
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-i"
                - "-c"
                - "mysqladmin ping -h 127.0.0.1 -u $MYSQL_USER -p$MYSQL_PASSWORD"
            initialDelaySeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: doctor-connect
    component: database
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: doctor-connect
    component: database
  type: ClusterIP
